<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>パチモン — PACHIMON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="app">

  <!-- ================= マップ ================= -->
  <canvas id="world"></canvas>
  <div id="vignette"></div>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="zone-pill" id="zone-pill">わかば草原</div>
      <div class="lead-card" id="lead-card">
        <span id="lead-name">—</span>
        <div class="hp-bar"><i id="lead-hp"></i></div>
      </div>
    </div>
    <div class="hud-right">
      <div class="money-pill">💰 <span id="money">0</span>パチ</div>
      <div class="ball-pill">⚪ パチボール <span id="ballcount">0</span></div>
      <button class="btn btn-yellow" id="btn-menu">メニュー <span class="key">M</span></button>
    </div>
    <div class="hud-hint" id="hud-hint">移動: WASD / 矢印　・　はしる: Shift　・　話す・調べる: E / Enter　・　メニュー: M</div>
  </div>

  <!-- タッチ操作 -->
  <div id="pad" class="hidden">
    <div class="dpad">
      <button class="dp up" data-dir="up">▲</button>
      <button class="dp left" data-dir="left">◀</button>
      <button class="dp right" data-dir="right">▶</button>
      <button class="dp down" data-dir="down">▼</button>
    </div>
    <div class="abtns">
      <button class="abtn" id="btn-a">A</button>
      <button class="abtn b" id="btn-b">B</button>
    </div>
  </div>

  <!-- ================= タイトル ================= -->
  <section id="title-screen" class="screen">
    <div class="starfield"></div>
    <div class="title-wrap">
      <div class="title-sprites">
        <canvas class="tsp" data-species="pikachun" width="140" height="140"></canvas>
        <canvas class="tsp" data-species="hitokage" width="140" height="140"></canvas>
        <canvas class="tsp" data-species="zenigame" width="140" height="140"></canvas>
      </div>
      <h1 class="logo"><span class="l1">パチ</span><span class="l2">モン</span></h1>
      <p class="logo-sub">PACHIMON — パクリモンスター コレクション RPG</p>
      <p class="logo-note">※ 本家とは いっさい カンケイ ありません（カンケい あるかもしれません）</p>
      <div class="title-menu">
        <button class="btn btn-yellow btn-big" id="btn-new">はじめから</button>
        <button class="btn btn-blue btn-big" id="btn-continue">つづきから</button>
      </div>
      <p class="title-foot">© 2026 パチもん製作委員会（今日 できた）</p>
    </div>
  </section>

  <!-- ================= 最初のパチモン選び ================= -->
  <section id="intro-screen" class="screen hidden">
    <div class="intro-wrap">
      <div class="intro-head">
        <canvas id="prof-canvas" width="120" height="150"></canvas>
        <div class="intro-text">
          <p class="prof-name">パチモンけんきゅうの きょじん ハカセ</p>
          <p>わかい トレーナーよ！ どの パチモンと たびに でるか、えらびたまえ！</p>
        </div>
      </div>
      <div class="starter-cards" id="starter-cards"></div>
      <div class="intro-actions">
        <button class="btn btn-blue" id="btn-back-title">もどる</button>
      </div>
    </div>
  </section>

  <!-- ================= バトル ================= -->
  <section id="battle-screen" class="screen hidden">
    <div class="battle-field">
      <div class="combatant enemy">
        <div class="status-card" id="enemy-card">
          <div class="status-top">
            <span class="status-name" id="enemy-name">—</span>
            <span class="status-lv" id="enemy-lv">Lv5</span>
          </div>
          <div class="status-types" id="enemy-types"></div>
          <div class="hp-bar"><i id="enemy-hp"></i></div>
        </div>
        <div class="sprite-wrap" id="enemy-wrap">
          <canvas id="enemy-canvas" width="320" height="320"></canvas>
        </div>
      </div>
      <div class="combatant player">
        <div class="sprite-wrap" id="player-wrap">
          <canvas id="player-canvas" width="320" height="320"></canvas>
        </div>
        <div class="status-card" id="player-card">
          <div class="status-top">
            <span class="status-name" id="player-name">—</span>
            <span class="status-lv" id="player-lv">Lv5</span>
          </div>
          <div class="hp-row">
            <div class="hp-bar"><i id="player-hp"></i></div>
            <span class="hp-num" id="player-hpnum">0/0</span>
          </div>
          <div class="exp-bar"><i id="player-exp"></i></div>
        </div>
      </div>
    </div>
    <div class="battle-ui">
      <div class="battle-log-wrap">
        <div class="battle-log" id="battle-log">…</div>
      </div>
      <div class="battle-actions" id="battle-actions"></div>
    </div>
  </section>

  <!-- ================= 汎用オーバーレイ ================= -->
  <div id="modal" class="overlay hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="modal-title">メニュー</h2>
        <button class="btn btn-close" id="modal-close">✕</button>
      </div>
      <div class="modal-tabs hidden" id="modal-tabs">
        <button data-tab="party">パーティ</button>
        <button data-tab="bag">バッグ</button>
        <button data-tab="dex">パチずかん</button>
        <button data-tab="system">レポート</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- はなし ボックス -->
  <div id="dialog-layer" class="overlay hidden">
    <div class="dialog-box">
      <div class="dialog-name" id="dialog-name"></div>
      <div class="dialog-text" id="dialog-text"></div>
      <div class="dialog-next">▼</div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="zone-banner"></div>
</div>

<script src="data.js"></script>
<script src="sprites.js"></script>
<script src="game.js"></script>
<script src="battle.js"></script>
</body>
</html>
